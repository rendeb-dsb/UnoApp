<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#b51224">
<link rel="manifest" href="manifest.json">
<title>U N O !</title>
<style>
:root{--red:#b51224;--dark:#202020;--gold:#ffdf42;--paper:#fffdf7}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;font-family:Arial,Helvetica,sans-serif;color:var(--dark);background:var(--paper)}
body{display:flex;flex-direction:column;min-height:100dvh}
header{flex:none;background:#fff;padding:5px 10px 7px;border-bottom:3px solid var(--red)}
.titleline{display:grid;grid-template-columns:60px 1fr 30px;align-items:center;min-height:39px}
.version{font-size:11px;color:#555;text-align:left;white-space:nowrap}
h1{font-size:clamp(21px,5vw,30px);letter-spacing:.16em;text-align:center;margin:0;font-weight:900;color:var(--red)}
.gear{font-size:22px;text-align:right;border:0;background:transparent;color:var(--dark);padding:0;cursor:pointer}
nav{display:flex;gap:7px;align-items:center;flex-wrap:wrap;padding-top:5px}
nav button{border:1px solid #aaa;border-radius:7px;background:#f2f2f2;padding:8px 13px;font-size:15px;font-weight:700;color:#222}
nav button.active{background:var(--red);color:#fff;border-color:var(--red)}
.subnav{display:none;gap:7px;padding-top:6px}
.subnav.show{display:flex}
.subnav button{background:#fff5c8;border:1px solid #d8b72c;border-radius:6px;padding:6px 12px}
#messageArea{flex:none;padding:9px 12px 7px;text-align:center;background:#fffdf7}
#statusMessage{font-size:20px;font-weight:800;color:var(--red);margin-bottom:5px}
#summary{font-size:13px;line-height:1.5}
#displayArea{position:relative;flex:1;min-height:200px;overflow:auto}
#hero{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:#fff}
#heroButton{position:absolute;inset:0;width:100%;height:100%;border:0;background:transparent;cursor:pointer}
#heroButton:focus-visible{outline:4px solid #1674d1;outline-offset:-4px}
.screen{display:none;min-height:100%;padding:12px;background:var(--paper)}
.screen.visible{display:block}
.screen h2{font-size:19px;margin:0;color:var(--red)}
.screenHeading{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin:0 0 12px}
.screenHeading h2{margin:0}
#activeTurn{color:#16833b;font-weight:800;text-align:right;white-space:nowrap;font-size:16px}
.notice{padding:12px;border:1px solid #ddd;border-radius:8px;background:white}
.scoreSummaryLine{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:nowrap}
.scoreSummaryLine span:last-child{text-align:right;white-space:nowrap}
.formrow{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:10px 0}
label{font-weight:700}input,select{font:inherit;padding:8px;border:1px solid #aaa;border-radius:5px;max-width:100%}
.action{border:0;border-radius:6px;background:var(--red);color:#fff;padding:9px 14px;font-weight:700}
.loserButtons{display:flex;gap:7px}
.loserButton{min-width:82px;border:1px solid #999;border-radius:6px;background:#eee;color:#222;padding:9px 12px;font:inherit;font-weight:700}
.loserButton.selected{background:var(--red);border-color:var(--red);color:#fff}
.loserButton:disabled{opacity:1}
.action:disabled{opacity:.45}
.secondary{border:1px solid #aaa;border-radius:6px;background:#eee;color:#222;padding:9px 14px;font-weight:700}
table{border-collapse:collapse;width:100%;background:white}th,td{border:1px solid #ccc;padding:7px 8px;text-align:left;white-space:nowrap}th{background:#f2e7e8}
#matchesTable{overflow:auto}
.matchBlock{border-bottom:1px solid #ddd;padding:0 0 8px;margin:0 0 8px}
.matchBlock:last-child{border-bottom:0;margin-bottom:0}
.matchTime{display:block;width:100%;text-align:left;background:#ffeb65;border:0;padding:7px 8px;font-weight:bold;cursor:pointer}
.matchTimeSpacer{display:block;width:100%;height:33px;padding:7px 8px;visibility:hidden}
.matchScores{padding:5px 8px;line-height:1.8;white-space:normal}
.finishRow{display:flex;justify-content:flex-end;margin:10px 0 14px}

.timecell{background:#ffeb65;cursor:pointer;font-weight:bold}
.timecell button{border:0;background:transparent;font:inherit;width:100%;text-align:left;cursor:pointer}
.small{font-size:12px;color:#555}

#dateDialog{border:0;border-radius:12px;padding:20px;max-width:calc(100% - 32px);width:340px;box-shadow:0 12px 40px #0005}
#dateDialog::backdrop,#gameOverDialog::backdrop,#scoresDialog::backdrop{background:#0008}
#dateDialog h2{margin:0 0 8px;color:var(--red);font-size:20px}
#dateDialog p{margin:0 0 14px}
#matchDate{width:100%;min-height:44px;margin-bottom:16px}
#gameOverDialog{border:0;border-radius:12px;padding:20px;max-width:calc(100% - 32px);width:340px;box-shadow:0 12px 40px #0005}
#gameOverDialog h2,#scoresDialog h2{margin:0 0 12px;color:var(--red);font-size:20px}
#scoresDialog{border:0;border-radius:12px;padding:20px;max-width:calc(100% - 32px);width:340px;box-shadow:0 12px 40px #0005}
#scoresDialog fieldset{border:0;padding:0;margin:0 0 18px}
#scoresDialog label{display:flex;align-items:center;gap:10px;font-weight:400;margin:12px 0}
#scoresDialog input[type=radio]{width:18px;height:18px}
#gameOverMessage{font-size:18px;margin:0 0 18px}
.dialogActions{display:flex;justify-content:flex-end;gap:8px}
@media(max-width:480px){nav button{padding:8px 10px;font-size:14px}.titleline{grid-template-columns:48px 1fr 25px}#summary{font-size:12px}th,td{padding:6px;font-size:13px}}
</style>
</head>
<body>
<header>
 <div class="titleline"><div class="version">b1v20</div><h1>U&nbsp; N O&nbsp; !</h1><button type="button" class="gear" id="gearButton" aria-label="Import or export scores" title="Import or export scores">⚙</button></div>
 <nav aria-label="Main menu">
  <button id="menuMatches" data-menu="matches">Matches</button>
  <button id="menuGames" data-menu="games">Games</button>
  <button id="menuStats" data-menu="stats">Stats</button>
 </nav>
 <div id="matchesSubnav" class="subnav"><button id="listMatches">List</button><button id="countMatches">Count</button></div>
</header>
<section id="messageArea">
 <div id="statusMessage">Let's Play UNO!</div>
 <div id="summary" style="display:none">Games played: 0 &nbsp; | &nbsp; Don's score: 0 &nbsp; | &nbsp; Paula's loses: 0</div>
</section>
<dialog id="dateDialog" aria-labelledby="dateDialogTitle">
 <h2 id="dateDialogTitle">New Match Date</h2>
 <p>Select the date for this match.</p>
 <input id="matchDate" type="date" required>
 <div class="dialogActions">
  <button type="button" class="secondary" id="cancelNewMatch">Cancel</button>
  <button type="button" class="action" id="confirmNewMatch">Continue</button>
 </div>
</dialog>
<dialog id="gameOverDialog" aria-labelledby="gameOverTitle">
 <h2 id="gameOverTitle">The UNO app says:</h2>
 <p id="gameOverMessage"></p>
 <div class="dialogActions"><button type="button" class="action" id="gameOverOk">Ok</button></div>
</dialog>
<dialog id="scoresDialog" aria-labelledby="scoresDialogTitle">
 <h2 id="scoresDialogTitle">The Uno App asks:</h2>
 <fieldset>
  <label><input type="radio" name="scoreAction" value="import"> Import scores</label>
  <label><input type="radio" name="scoreAction" value="export"> Export Scores</label>
 </fieldset>
 <div class="dialogActions"><button type="button" class="secondary" id="cancelScoresAction">Cancel</button><button type="button" class="action" id="continueScoresAction" disabled>Continue</button></div>
</dialog>
<input id="importFileInput" type="file" accept=".json,application/json" hidden>
<main id="displayArea">
 <img id="hero" src="./uno-reverse-pack.jpg?v=b1v20" alt="UNO Reverse Pack">
 <button id="heroButton" aria-label="Start or continue match"></button>
 <section id="matchesScreen" class="screen"><h2>Matches</h2><div id="matchesTable"></div></section>
 <section id="gamesScreen" class="screen"><div class="screenHeading"><h2>Games</h2><span id="activeTurn"></span></div><div id="gameScreenContent"></div></section>
 <section id="statsScreen" class="screen"><h2>Stats</h2><div id="statsContent" class="notice"></div></section>
</main>
<script src="https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.10.3/sql-wasm.js"></script>
<script>
"use strict";
const DB_NAME="UnoDB", DB_KEY="sqlite-bytes";
let db=null, SQL=null, currentMatchId=null, activeMenu=null, selectedLoser=null;
const $=id=>document.getElementById(id);
function idbOpen(){return new Promise((resolve,reject)=>{const req=indexedDB.open("UnoAppStorage",1);req.onupgradeneeded=()=>req.result.createObjectStore("files");req.onsuccess=()=>resolve(req.result);req.onerror=()=>reject(req.error);});}
async function persistDb(){const bytes=db.export();const store=await idbOpen();await new Promise((resolve,reject)=>{const tx=store.transaction("files","readwrite");tx.objectStore("files").put(bytes,DB_KEY);tx.oncomplete=resolve;tx.onerror=()=>reject(tx.error);});store.close();}
async function loadDb(){const store=await idbOpen();const bytes=await new Promise((resolve,reject)=>{const tx=store.transaction("files","readonly");const req=tx.objectStore("files").get(DB_KEY);req.onsuccess=()=>resolve(req.result);req.onerror=()=>reject(req.error);});store.close();if(bytes)db=new SQL.Database(new Uint8Array(bytes));else db=new SQL.Database();db.run("PRAGMA foreign_keys = ON;");db.run(`CREATE TABLE IF NOT EXISTS Matches(MatchId INTEGER PRIMARY KEY AUTOINCREMENT, Date TEXT NOT NULL, Time TEXT NOT NULL);`);db.run(`CREATE TABLE IF NOT EXISTS Games(GameId INTEGER PRIMARY KEY AUTOINCREMENT, MatchId INTEGER NOT NULL, Loser TEXT NOT NULL CHECK(Loser IN ('D','P')), Score INTEGER NOT NULL CHECK(typeof(Score)='integer' AND Score>0), FOREIGN KEY(MatchId) REFERENCES Matches(MatchId));`);await persistDb();}
function appAlert(message){alert("The UNO app says: "+message);}
function appConfirm(message){return confirm("The UNO app says: "+message);}
function rows(sql,params=[]){const stmt=db.prepare(sql);stmt.bind(params);const out=[];while(stmt.step())out.push(stmt.getAsObject());stmt.free();return out;}
function run(sql,params=[]){db.run(sql,params);return persistDb();}
function getLatestMatch(){return rows("SELECT * FROM Matches ORDER BY MatchId DESC LIMIT 1")[0]||null;}
function matchTotals(matchId){return rows("SELECT COUNT(*) AS n, COALESCE(SUM(CASE WHEN Loser='D' THEN Score ELSE 0 END),0) AS don, COALESCE(SUM(CASE WHEN Loser='P' THEN Score ELSE 0 END),0) AS paula FROM Games WHERE MatchId=?",[matchId])[0];}
function isContinuing(matchId){const t=matchTotals(matchId);return Number(t.don)<300&&Number(t.paula)<300;}
function activeMatch(){const m=getLatestMatch();return m&&isContinuing(m.MatchId)?m:null;}
function updateMessage(){$("summary").style.display="none";const m=getLatestMatch();const active=m&&isContinuing(m.MatchId)?m:null;if(!active){$("statusMessage").textContent="Let's Play UNO!";$("summary").textContent="Games played: 0  |  Don's score: 0  |  Paula's loses: 0";currentMatchId=null;return;}currentMatchId=active.MatchId;const t=matchTotals(active.MatchId);$("statusMessage").textContent="Match underway";$("summary").textContent=`Games played: ${t.n}  |  Don's score: ${t.don}  |  Paula's loses: ${t.paula}`;}
function hideScreens(){document.querySelectorAll(".screen").forEach(s=>s.classList.remove("visible"));$("hero").style.display="none";$("heroButton").style.display="none";}
function showHome(){$("messageArea").style.display="block";hideScreens();$("hero").style.display="block";$("heroButton").style.display="block";activeMenu=null;document.querySelectorAll("nav button").forEach(b=>b.classList.remove("active"));$("matchesSubnav").classList.remove("show");updateMessage();}
function selectMenu(name){$("messageArea").style.display=name==="games"?"none":"block";$("summary").style.display="none";activeMenu=name;document.querySelectorAll("nav button").forEach(b=>b.classList.toggle("active",b.dataset.menu===name));$("matchesSubnav").classList.toggle("show",name==="matches");hideScreens();if(name==="matches")showMatches();if(name==="games")showGames();if(name==="stats"){$("statsScreen").classList.add("visible");showStats();}updateMessage();}
function showStats(){
 const matches=Number(rows("SELECT COUNT(*) AS n FROM Matches")[0].n);
 const games=Number(rows("SELECT COUNT(*) AS n FROM Games")[0].n);
 const average=matches? (games/matches).toFixed(2):"0.00";
 const donMatchLosses=Number(rows("SELECT COUNT(*) AS n FROM Matches m WHERE COALESCE((SELECT SUM(g.Score) FROM Games g WHERE g.MatchId=m.MatchId AND g.Loser='D'),0)>=300")[0].n);
 const paulaMatchLosses=Number(rows("SELECT COUNT(*) AS n FROM Matches m WHERE COALESCE((SELECT SUM(g.Score) FROM Games g WHERE g.MatchId=m.MatchId AND g.Loser='P'),0)>=300")[0].n);
 const donGameLosses=Number(rows("SELECT COUNT(*) AS n FROM Games WHERE Loser='D'")[0].n);
 const paulaGameLosses=Number(rows("SELECT COUNT(*) AS n FROM Games WHERE Loser='P'")[0].n);
 const donMostWins=Number(rows("SELECT COALESCE(MAX(n),0) AS n FROM (SELECT MatchId, SUM(CASE WHEN Loser='P' THEN 1 ELSE 0 END) AS n FROM Games GROUP BY MatchId)")[0].n);
 const paulaMostWins=Number(rows("SELECT COALESCE(MAX(n),0) AS n FROM (SELECT MatchId, SUM(CASE WHEN Loser='D' THEN 1 ELSE 0 END) AS n FROM Games GROUP BY MatchId)")[0].n);
 $("statsContent").innerHTML=`<div>Average number of games per match: <b>${average}</b></div><div>Number of match losses for Don: <b>${donMatchLosses}</b></div><div>Number of match losses for Paula: <b>${paulaMatchLosses}</b></div><div>Number of game losses for Don: <b>${donGameLosses}</b></div><div>Number of game losses for Paula: <b>${paulaGameLosses}</b></div><div>Most games won in a match (Don): <b>${donMostWins}</b></div><div>Most games won in a match (Paula): <b>${paulaMostWins}</b></div><p class="small">Average = total recorded games (${games}) ÷ total matches (${matches}). A match loss is counted when that player's accumulated game-loss scores reach 300 or more. Games won = games in which the other player was recorded as the loser; the statistic is the maximum in any one match.</p>`;
}
function startOrContinue(){
 let m=activeMatch();
 if(m){currentMatchId=m.MatchId;selectedLoser=null;selectMenu("games");return;}
 const d=new Date();
 $("matchDate").value=`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
 if(typeof $("dateDialog").showModal==="function") $("dateDialog").showModal();
 else {const chosen=prompt("Enter match date (YYYY-MM-DD):",$("matchDate").value);if(chosen)createMatchWithDate(chosen);}
}
async function createMatchWithDate(date){
 date=String(date||"").trim();
 // Parse the date without a regular expression. Android displays a localized
 // date, but an HTML date input's .value is expected to be YYYY-MM-DD.
 const parts=date.split("-");
 if(parts.length!==3||parts[0].length!==4||parts[1].length!==2||parts[2].length!==2){
   appAlert("Please select a valid match date.");return;
 }
 const year=Number(parts[0]), month=Number(parts[1]), day=Number(parts[2]);
 if(!Number.isInteger(year)||!Number.isInteger(month)||!Number.isInteger(day)||year<1||month<1||month>12||day<1||day>31){
   appAlert("Please select a valid match date.");return;
 }
 const parsed=new Date(Date.UTC(year,month-1,day));
 if(parsed.getUTCFullYear()!==year||parsed.getUTCMonth()!==month-1||parsed.getUTCDate()!==day){
   appAlert("Please select a valid calendar date.");return;
 }
 date=parts.join("-");
 const d=new Date();
 const time=`${String(d.getHours()).padStart(2,"0")}:${String(d.getMinutes()).padStart(2,"0")}`;
 await run("INSERT INTO Matches(Date,Time) VALUES(?,?)",[date,time]);
 const m=getLatestMatch();currentMatchId=m.MatchId;selectedLoser=null;
 $("dateDialog").close();
 selectMenu("games");
}
async function startNewMatchNow(){
 const d=new Date();
 const date=`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
 await createMatchWithDate(date);
}
function showMatches(){
 $("messageArea").style.display="block";$("summary").style.display="none";hideScreens();$("matchesScreen").classList.add("visible");
 const matches=rows("SELECT * FROM Matches ORDER BY Date DESC, Time DESC, MatchId DESC");
 if(!matches.length){$("matchesTable").innerHTML='<div class="notice">No matches recorded.</div>';return;}
 const dates=[...new Set(matches.map(m=>m.Date))];
 let html='<table><thead><tr>';
 dates.forEach(d=>html+=`<th colspan="2">${escapeHtml(d)}</th>`);
 html+='</tr></thead><tbody><tr>';
 dates.forEach(date=>{
   const dayMatches=matches.filter(m=>m.Date===date);
   html+='<td style="vertical-align:top;white-space:normal;width:65px;min-width:65px;padding:4px">';
   dayMatches.forEach(m=>{
     const gs=rows("SELECT * FROM Games WHERE MatchId=? ORDER BY GameId",[m.MatchId]);
     html+=`<div class="matchBlock"><button class="matchTime" data-match="${m.MatchId}" aria-label="Open match ${escapeHtml(m.Date)} ${escapeHtml(m.Time)}">${escapeHtml(m.Time)}</button>`;
     if(gs.length) html+=`<div class="matchScores">${gs.map(g=>escapeHtml(g.Score)).join("<br>")}</div>`;
     html+='</div>';
   });
   html+='</td><td style="vertical-align:top;white-space:normal;width:65px;min-width:65px;padding:4px">';
   dayMatches.forEach(m=>{
     const gs=rows("SELECT Loser FROM Games WHERE MatchId=? ORDER BY GameId",[m.MatchId]);
     html+='<div class="matchBlock"><div class="matchTimeSpacer" aria-hidden="true">&nbsp;</div><div class="matchScores">';
     if(gs.length) html+=gs.map(g=>escapeHtml(g.Loser==="D"?"Don":"Paula")).join("<br>");
     else html+='&nbsp;';
     html+='</div></div>';
   });
   html+='</td>';
 });
 html+='</tr></tbody></table><p class="small">Select a yellow time cell to review that match. The adjacent column identifies the player who lost each game.</p>';
 $("matchesTable").innerHTML=html;
 $("matchesTable").querySelectorAll("button[data-match]").forEach(b=>b.addEventListener("click",()=>{
   currentMatchId=Number(b.dataset.match);selectedLoser=null;selectMenu("games");
 }));
}
function showMatchCount(){
 $("messageArea").style.display="block";$("summary").style.display="none";hideScreens();$("matchesScreen").classList.add("visible");
 const counts=rows("SELECT Date, COUNT(*) AS MatchCount FROM Matches GROUP BY Date ORDER BY Date DESC");
 let html='<h2>Match Count</h2>';
 if(!counts.length){html+='<div class="notice">No matches recorded.</div>';$("matchesTable").innerHTML=html;return;}
 html+='<table><thead><tr><th>Date</th><th>Number of matches</th></tr></thead><tbody>';
 counts.forEach(r=>{html+=`<tr><td>${escapeHtml(r.Date)}</td><td>${Number(r.MatchCount)}</td></tr>`;});
 html+='</tbody></table>';
 $("matchesTable").innerHTML=html;
}

function showGames(){
 $("messageArea").style.display="none";hideScreens();$("gamesScreen").classList.add("visible");
 const m= currentMatchId ? rows("SELECT * FROM Matches WHERE MatchId=?",[currentMatchId])[0] : activeMatch();
 if(!m){$("gameScreenContent").innerHTML='<div class="notice">No active match. Press the UNO graphic to begin a match.</div>';return;}
 currentMatchId=m.MatchId;
 const t=matchTotals(m.MatchId);
 const ended=!(Number(t.don)<300&&Number(t.paula)<300);
 const gs=rows("SELECT * FROM Games WHERE MatchId=? ORDER BY GameId",[m.MatchId]);
 const donLosses=gs.filter(g=>g.Loser==="D").length;
 const paulaLosses=gs.filter(g=>g.Loser==="P").length;
 const activePlayer=gs.length%2===0?"Don":"Paula";
 $("activeTurn").textContent=activePlayer+"'s turn";
 let html=`<div class="notice"><b>Match:</b> ${escapeHtml(m.Date)} ${escapeHtml(m.Time)}<br>Games played: ${t.n}<div class="scoreSummaryLine"><span>Don's score: ${t.don}</span><span>Don's losses: ${donLosses}</span></div><div class="scoreSummaryLine"><span>Paula's score: ${t.paula}</span><span>Paula's losses: ${paulaLosses}</span></div>${ended?'<p><b>Match complete (300-point limit reached).</b></p>':''}</div>`;
 if(!ended){
   html+='<h3>Record completed game</h3><div class="formrow"><label>Loser:</label><div class="loserButtons" role="group" aria-label="Select loser"><button type="button" class="loserButton" id="loserDon" aria-pressed="false">Don</button><button type="button" class="loserButton" id="loserPaula" aria-pressed="false">Paula</button></div><label for="score">Score:</label><input id="score" type="number" min="1" step="1" inputmode="numeric" placeholder="Points" disabled style="width:70px"><button class="action" id="saveGame" disabled>Save</button></div>';
 }
 html+='<h3>Games in this match</h3>';
 if(!gs.length)html+='<p>No games recorded yet.</p>';
 else{html+='<table><thead><tr><th>Game</th><th>Loser</th><th>Score</th></tr></thead><tbody>';gs.forEach((g,i)=>html+=`<tr><td>${i+1}</td><td>${escapeHtml(g.Loser==="D"?"Don":"Paula")}</td><td>${g.Score}</td></tr>`);html+='</tbody></table>';}
 $("gameScreenContent").innerHTML=html;
 const scoreInput=$("score"), save=$("saveGame");
 function setLoser(loser){
   selectedLoser=loser;
   $("loserDon").classList.toggle("selected",loser==="D");
   $("loserPaula").classList.toggle("selected",loser==="P");
   $("loserDon").setAttribute("aria-pressed",String(loser==="D"));
   $("loserPaula").setAttribute("aria-pressed",String(loser==="P"));
   scoreInput.disabled=false;scoreInput.focus();
   updateSaveState();
 }
 function updateSaveState(){
   if(!save)return;
   const score=Number(scoreInput.value);
   save.disabled=!(selectedLoser&&scoreInput.value.trim()!==""&&Number.isInteger(score)&&score>0);
 }
 if(!ended){
   $("loserDon").addEventListener("click",()=>setLoser("D"));
   $("loserPaula").addEventListener("click",()=>setLoser("P"));
   scoreInput.addEventListener("input",updateSaveState);
   save.addEventListener("click",async()=>{
     if(!selectedLoser){appAlert("Select Don or Paula as the loser.");return;}
     const score=Number(scoreInput.value);
     if(!Number.isInteger(score)||score<=0){appAlert("Enter a positive whole-number score.");return;}
     save.disabled=true;
     try{
       const savedMatchId=currentMatchId;
       await run("INSERT INTO Games(MatchId,Loser,Score) VALUES(?,?,?)",[savedMatchId,selectedLoser,score]);
       selectedLoser=null;updateMessage();showGames();
       const totals=matchTotals(savedMatchId);
       let defeatedPlayer=null;
       if(Number(totals.don)>=300)defeatedPlayer="Don";
       else if(Number(totals.paula)>=300)defeatedPlayer="Paula";
       if(defeatedPlayer){
         $("gameOverMessage").textContent=defeatedPlayer+" lost!";
         if(typeof $("gameOverDialog").showModal==="function")$("gameOverDialog").showModal();
         else if(appConfirm(defeatedPlayer+" lost!"))await startNewMatchNow();
       }
     }catch(e){save.disabled=false;appAlert("Could not save game: "+e.message);}
   });
 }
}
function localTimestampParts(){
 const d=new Date();
 const date=`${d.getFullYear()}${String(d.getMonth()+1).padStart(2,"0")}${String(d.getDate()).padStart(2,"0")}`;
 const time=`${String(d.getHours()).padStart(2,"0")}${String(d.getMinutes()).padStart(2,"0")}${String(d.getSeconds()).padStart(2,"0")}`;
 return {date,time};
}
function exportPayload(){
 return {format:"UnoAppScores",formatVersion:1,exportedAt:new Date().toISOString(),Matches:rows("SELECT MatchId, Date, Time FROM Matches ORDER BY MatchId"),Games:rows("SELECT GameId, MatchId, Loser, Score FROM Games ORDER BY GameId")};
}
async function exportScores(){
 const payload=JSON.stringify(exportPayload(),null,2);const stamp=localTimestampParts();const filename=`UNO-${stamp.date}-${stamp.time}.JSON`;
 const blob=new Blob([payload],{type:"application/json"});
 if(typeof window.showSaveFilePicker==="function"){
   try{const handle=await window.showSaveFilePicker({suggestedName:filename,types:[{description:"UNO score backup (JSON)",accept:{"application/json":[".JSON",".json"]}}]});const writable=await handle.createWritable();await writable.write(blob);await writable.close();appAlert("Scores exported successfully.");return;}
   catch(e){if(e&&e.name==="AbortError")return;console.warn("Save picker unavailable; using download instead.",e);}
 }
 const url=URL.createObjectURL(blob);const a=document.createElement("a");a.href=url;a.download=filename;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);
 appAlert("The JSON backup was prepared for download. Choose your Downloads folder or another available save location in the browser.");
}
function validateImportPayload(data){
 if(!data||typeof data!=="object"||Array.isArray(data)||data.format!=="UnoAppScores"||data.formatVersion!==1||!Array.isArray(data.Matches)||!Array.isArray(data.Games))throw new Error("This is not a supported UnoApp score backup.");
 const matchIds=new Set(),gameIds=new Set();
 const validDate=value=>{if(typeof value!=="string"||!/^\d{4}-\d{2}-\d{2}$/.test(value))return false;const [y,m,d]=value.split("-").map(Number);const dt=new Date(Date.UTC(y,m-1,d));return dt.getUTCFullYear()===y&&dt.getUTCMonth()===m-1&&dt.getUTCDate()===d;};
 const validTime=value=>typeof value==="string"&&/^([01]\d|2[0-3]):[0-5]\d$/.test(value);
 for(const m of data.Matches){if(!m||!Number.isSafeInteger(m.MatchId)||m.MatchId<=0||matchIds.has(m.MatchId)||!validDate(m.Date)||!validTime(m.Time))throw new Error("The backup contains an invalid or duplicate match record.");matchIds.add(m.MatchId);}
 for(const g of data.Games){if(!g||!Number.isSafeInteger(g.GameId)||g.GameId<=0||gameIds.has(g.GameId)||!Number.isSafeInteger(g.MatchId)||!matchIds.has(g.MatchId)||!['D','P'].includes(g.Loser)||!Number.isSafeInteger(g.Score)||g.Score<=0)throw new Error("The backup contains an invalid game record or a game without a matching match.");gameIds.add(g.GameId);}
 return true;
}
async function importScoresFile(file){
 if(!file) return;
 if(!/^UNO-.+\.JSON$/i.test(file.name)){appAlert('Please select a backup file named like "UNO-YYYYMMDD-HHMMSS.JSON".');return;}
 let data;try{data=JSON.parse(await file.text());validateImportPayload(data);}catch(e){appAlert("Import cancelled. "+(e.message||"The selected file is not valid JSON."));return;}
 if(!appConfirm(`This backup contains ${data.Matches.length} match record(s) and ${data.Games.length} game record(s). Importing will REPLACE all existing UnoApp match and game records. Continue?`))return;
 const previousBytes=db.export();
 try{
  db.run("BEGIN TRANSACTION");
  db.run("DELETE FROM Games");db.run("DELETE FROM Matches");
  for(const m of data.Matches)db.run("INSERT INTO Matches(MatchId,Date,Time) VALUES(?,?,?)",[m.MatchId,m.Date,m.Time]);
  for(const g of data.Games)db.run("INSERT INTO Games(GameId,MatchId,Loser,Score) VALUES(?,?,?,?)",[g.GameId,g.MatchId,g.Loser,g.Score]);
  db.run("COMMIT");
  try{await persistDb();}catch(e){db.close();db=new SQL.Database(new Uint8Array(previousBytes));db.run("PRAGMA foreign_keys = ON;");throw e;}
  currentMatchId=null;selectedLoser=null;showHome();appAlert("Scores imported successfully. Existing match and game records were replaced.");
 }catch(e){try{db.run("ROLLBACK");}catch(_){}appAlert("Import failed; the existing records were preserved. "+e.message);}
}
